CONFIG_RUST=y
CONFIG_RUST_ALLOC=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_GPIO=y
# UART0 to the PocketBeagle, polled.
CONFIG_SERIAL=y
CONFIG_ADC=y

# Logs go to the console, which the cdc-acm-console snippet puts on USB.
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=n

# Our buttons and encoders are read directly, not through Zephyr's input
# subsystem.
CONFIG_INPUT=n

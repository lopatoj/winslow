[package]
name = "winslowd"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync"] }
hardware = { path = "../hardware" }
wmidi = "4.0.11"
# Debian 12 ships libiio 0.24; the default (0.25) bindings would not match.
industrial-io = { version = "0.6.1", default-features = false, features = ["libiio_v0_24"] }
futures-core = "0.3.34"
tokio-stream = "0.1.19"
async-stream = "0.3.6"
usb-gadget = "1.3.0"
systemd = "0.11.1"
alsa = "0.12.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
